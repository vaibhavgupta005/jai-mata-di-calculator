<!DOCTYPE html>
<html lang="en">
<head>
   <meta name="theme-color" content="#8b0000">
    <link rel="manifest" href="./manifest.json">

<link rel="icon" href="./icon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jai Mata Di Calculator</title>

    <meta name="theme-color" content="#8b0000">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #8b0000;
            font-size: 26px;
        }

        header p {
            color: #666;
            margin-top: 6px;
        }

        .section {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .section h2 {
            color: #8b0000;
            margin-bottom: 15px;
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #8b0000;
        }

        .amount {
            background: #fff3f3;
            padding: 12px;
            margin-top: 15px;
            border-radius: 7px;
            font-size: 18px;
            font-weight: bold;
            color: #8b0000;
        }

        .total-box {
            background: #8b0000;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-top: 20px;
        }

        .total-box h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .total {
            font-size: 30px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset {
            background: #ddd;
            color: #222;
        }

        .print {
            background: #8b0000;
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 16px;
            }

            header h1 {
                font-size: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            .buttons {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Jai Mata Di</h1>
        <h2>Tent Caterer and Event</h2>
        <p>Square Feet Rate Calculator</p>
    </header>

    <!-- WALLING -->
    <div class="section">
        <h2>Walling</h2>

        <label for="wallArea">Walling Area (Square Feet)</label>
        <input type="number" id="wallArea" placeholder="Enter walling sq ft"
               min="0" step="any" oninput="calculate()">

        <label for="wallRate">Walling Rate (₹ per sq ft)</label>
        <input type="number" id="wallRate" placeholder="Enter walling rate"
               min="0" step="any" oninput="calculate()">

        <div class="amount">
            Walling Amount: ₹<span id="wallTotal">0.00</span>
        </div>
    </div>

    <!-- CEILING -->
    <div class="section">
        <h2>Ceiling</h2>

        <label for="ceilingArea">Ceiling Area (Square Feet)</label>
        <input type="number" id="ceilingArea" placeholder="Enter ceiling sq ft"
               min="0" step="any" oninput="calculate()">

        <label for="ceilingRate">Ceiling Rate (₹ per sq ft)</label>
        <input type="number" id="ceilingRate" placeholder="Enter ceiling rate"
               min="0" step="any" oninput="calculate()">

        <div class="amount">
            Ceiling Amount: ₹<span id="ceilingTotal">0.00</span>
        </div>
    </div>

    <!-- CARPETING -->
    <div class="section">
        <h2>Carpeting</h2>

        <label for="carpetArea">Carpeting Area (Square Feet)</label>
        <input type="number" id="carpetArea" placeholder="Enter carpeting sq ft"
               min="0" step="any" oninput="calculate()">

        <label for="carpetRate">Carpeting Rate (₹ per sq ft)</label>
        <input type="number" id="carpetRate" placeholder="Enter carpeting rate"
               min="0" step="any" oninput="calculate()">

        <div class="amount">
            Carpeting Amount: ₹<span id="carpetTotal">0.00</span>
        </div>
    </div>

    <!-- GRAND TOTAL -->
    <div class="total-box">
        <h2>Grand Total</h2>
        <div class="total">₹<span id="grandTotal">0.00</span></div>
    </div>

    <div class="buttons">
        <button class="reset" onclick="resetCalculator()">Reset</button>
        <button class="print" onclick="window.print()">Print Bill</button>
    </div>

    <footer>
        Jai Mata Di Tent Caterer and Event
    </footer>

</div>

<script>
    function getValue(id) {
        const value = parseFloat(document.getElementById(id).value);
        return isNaN(value) || value < 0 ? 0 : value;
    }

    function calculate() {

        // Walling calculation
        const wallArea = getValue("wallArea");
        const wallRate = getValue("wallRate");
        const wallAmount = wallArea * wallRate;

        // Ceiling calculation
        const ceilingArea = getValue("ceilingArea");
        const ceilingRate = getValue("ceilingRate");
        const ceilingAmount = ceilingArea * ceilingRate;

        // Carpeting calculation
        const carpetArea = getValue("carpetArea");
        const carpetRate = getValue("carpetRate");
        const carpetAmount = carpetArea * carpetRate;

        // Grand total
        const grandTotal = wallAmount + ceilingAmount + carpetAmount;

        // Display amounts
        document.getElementById("wallTotal").textContent =
            wallAmount.toFixed(2);

        document.getElementById("ceilingTotal").textContent =
            ceilingAmount.toFixed(2);

        document.getElementById("carpetTotal").textContent =
            carpetAmount.toFixed(2);

        document.getElementById("grandTotal").textContent =
            grandTotal.toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
    }

    function resetCalculator() {

        document.getElementById("wallArea").value = "";
        document.getElementById("wallRate").value = "";

        document.getElementById("ceilingArea").value = "";
        document.getElementById("ceilingRate").value = "";

        document.getElementById("carpetArea").value = "";
        document.getElementById("carpetRate").value = "";

        calculate();
    }

    calculate();
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function () {
                console.log("Service Worker registered");
            })
            .catch(function (error) {
                console.log("Service Worker error:", error);
            });
    });
}
</script>
}
</script>
</body>
</html>
