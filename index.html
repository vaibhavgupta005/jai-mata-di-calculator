<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jai Mata Di Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h1, h2 {
    color: #8b0000;
    text-align: center;
}

.section {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.amount {
    margin-top: 15px;
    padding: 12px;
    background: #fff0f0;
    color: #8b0000;
    font-weight: bold;
}

.total-box {
    background: #8b0000;
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.total-box h2 {
    color: white;
}

#grandTotal {
    font-size: 30px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 7px;
    background: #8b0000;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

footer {
    text-align: center;
    margin-top: 20px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

<h1>Jai Mata Di</h1>
<h2>Tent Caterer and Event</h2>
<p style="text-align:center;">Square Feet Rate Calculator</p>

<!-- WALLING -->
<div class="section">
<h2>Walling</h2>

<label>Walling Area (Sq Ft)</label>
<input type="number" id="wallArea" min="0" step="any">

<label>Walling Rate (₹ per Sq Ft)</label>
<input type="number" id="wallRate" min="0" step="any">

<div class="amount">
Walling Amount: ₹<span id="wallTotal">0.00</span>
</div>
</div>

<!-- CEILING -->
<div class="section">
<h2>Ceiling</h2>

<label>Ceiling Area (Sq Ft)</label>
<input type="number" id="ceilingArea" min="0" step="any">

<label>Ceiling Rate (₹ per Sq Ft)</label>
<input type="number" id="ceilingRate" min="0" step="any">

<div class="amount">
Ceiling Amount: ₹<span id="ceilingTotal">0.00</span>
</div>
</div>

<!-- CARPETING -->
<div class="section">
<h2>Carpeting</h2>

<label>Carpeting Area (Sq Ft)</label>
<input type="number" id="carpetArea" min="0" step="any">

<label>Carpeting Rate (₹ per Sq Ft)</label>
<input type="number" id="carpetRate" min="0" step="any">

<div class="amount">
Carpeting Amount: ₹<span id="carpetTotal">0.00</span>
</div>
</div>

<!-- GRAND TOTAL -->
<div class="total-box">
<h2>Grand Total</h2>
₹<span id="grandTotal">0.00</span>
</div>

<button type="button" id="resetBtn">Reset Calculator</button>
<button type="button" onclick="window.print()">Print</button>

<footer>
Jai Mata Di Tent Caterer and Event
</footer>

</div>

<script>
(function () {

    function numberValue(id) {
        const element = document.getElementById(id);
        const value = parseFloat(element.value);

        return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function money(amount) {
        return amount.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function calculate() {

        const wallAmount =
            numberValue("wallArea") * numberValue("wallRate");

        const ceilingAmount =
            numberValue("ceilingArea") * numberValue("ceilingRate");

        const carpetAmount =
            numberValue("carpetArea") * numberValue("carpetRate");

        const grandTotal =
            wallAmount + ceilingAmount + carpetAmount;

        document.getElementById("wallTotal").textContent =
            money(wallAmount);

        document.getElementById("ceilingTotal").textContent =
            money(ceilingAmount);

        document.getElementById("carpetTotal").textContent =
            money(carpetAmount);

        document.getElementById("grandTotal").textContent =
            money(grandTotal);
    }

    const inputIds = [
        "wallArea",
        "wallRate",
        "ceilingArea",
        "ceilingRate",
        "carpetArea",
        "carpetRate"
    ];

    inputIds.forEach(function (id) {
        document.getElementById(id).addEventListener("input", calculate);
    });

    document.getElementById("resetBtn").addEventListener("click", function () {

        inputIds.forEach(function (id) {
            document.getElementById(id).value = "";
        });

        calculate();
    });

    calculate();

})();
</script>

</body>
</html>
